name: 2022 Energy Opportunity Bridge

on:
  push:
    branches:
      - research/adaptive-market-state-backtest
    paths:
      - scripts/energy_2022_sector_bridge.py
      - .github/workflows/energy-2022-sector-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-2022-2026
      - name: Install
        run: pip install requests
      - name: Run bridge
        run: python scripts/energy_2022_sector_bridge.py
      - name: Commit bridge
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/energy_2022_sector_bridge.md backtests/results/energy_2022_sector_bridge.json
          git diff --cached --quiet && exit 0
          git commit -m "Update 2022 Energy opportunity bridge [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
