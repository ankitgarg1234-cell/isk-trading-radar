name: GEM Isolated Daily Public Ingestion Safety Tests
on:
  pull_request:
    branches:
      - draft/gem-standalone-render-20261012
    paths:
      - "gem_data/gem_public_ingest.py"
      - "gem_data/gem_standalone.py"
      - "tests/test_gem_public_ingest.py"
      - ".github/workflows/gem-isolated-public-ingestion-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: GEM-only isolated public data ingestion and safe app tests
        run: python -m pytest -q tests/test_gem_public_ingest.py tests/test_gem_standalone.py tests/test_gem_dashboard.py
