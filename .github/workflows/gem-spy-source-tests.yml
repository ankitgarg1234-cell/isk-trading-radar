name: GEM SPY Original Distribution Evidence Tests
on:
  pull_request:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "gem_data/gem_public_ingest.py"
      - "tests/test_gem_spy_distribution_source.py"
      - ".github/workflows/gem-spy-source-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spy-public-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest reportlab
      - run: python -m pytest -q tests/test_gem_spy_distribution_source.py tests/test_gem_public_ingest.py
