name: GEM SEC ZIP Range Ingestion Safety
on:
  pull_request:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "gem_data/sec_bulk_zip_ingest.py"
      - "gem_data/sec_zip_index.py"
      - "gem_data/gem_standalone.py"
      - "tests/test_gem_sec_bulk_zip_ingest.py"
      - ".github/workflows/gem-sec-zip-ingest-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: SEC original ZIP bounded-range tests with mocked remote archive
        run: python -m pytest -q tests/test_gem_sec_bulk_zip_ingest.py tests/test_gem_standalone.py tests/test_gem_sec_collector.py
