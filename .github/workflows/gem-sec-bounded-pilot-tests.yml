name: GEM SEC Bounded Pilot Safety Tests
on:
  pull_request:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "gem_data/sec_daily_discovery.py"
      - "gem_data/gem_public_ingest.py"
      - "tests/test_gem_sec_daily_discovery.py"
      - ".github/workflows/gem-sec-bounded-pilot-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_gem_sec_daily_discovery.py tests/test_gem_standalone.py
