name: WF3 Walk-Forward Optimization

on:
  push:
    paths:
      - scripts/wf3_walkforward_optimize.py
      - scripts/walkforward_backtest.py
      - scripts/wf3_offline_valuein.py
      - .github/workflows/wf3-walkforward-optimize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf3-walkforward-optimize
  cancel-in-progress: true

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        score: ["68","66","64","62"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - name: Run score arm
        run: |
          python scripts/wf3_walkforward_optimize.py \
            --score-floor "${{ matrix.score }}" \
            --output "backtests/results/wf3_opt_score_${{ matrix.score }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "wf3-opt-${{ matrix.score }}"
          path: "backtests/results/wf3_opt_score_${{ matrix.score }}.json"
          retention-days: 7

  aggregate:
    needs: grid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: "wf3-opt-*"
          path: backtests/results/opt_parts
          merge-multiple: true
      - name: Aggregate without peeking at holdout for selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('backtests/results/opt_parts')
          parts=[json.load(open(root/f'wf3_opt_score_{s}.json')) for s in ('68','66','64','62')]
          results=[r for p in parts for r in p['results']]
          eligible=[r for r in results if r['train']['max_drawdown_pct']>=-15.0]
          # IMPORTANT: ranking uses TRAIN metrics only. 2026 holdout is not part of sorting.
          ranked=sorted(eligible,key=lambda r:(r['train']['alpha_pct'],r['train']['cagr_pct'],-r['train']['average_cash_pct']),reverse=True)
          top=ranked[:12]
          benchmark=parts[0]['benchmark']
          out={
            'version':'wf3-walkforward-opt-comparison-v1',
            'selection_rule':'2024-2025 train alpha descending, train max drawdown <=15%; 2026 holdout never used to select',
            'benchmark':benchmark,
            'top_train_selected':top,
            'all_results':results,
          }
          Path('backtests/results/wf3_walkforward_optimization.json').write_text(json.dumps(out,indent=2))
          lines=['# WF3 Walk-Forward Optimization','',
                 '**Selection uses only 2024-2025. 2026 is an untouched holdout.**','',
                 '| Rank | Score floor | Entry | Min alloc | Idle cash in S&P | Train return | Train alpha | Train DD | 2026 return | 2026 S&P | 2026 alpha | 2026 DD | Trades |',
                 '|---:|---:|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for i,r in enumerate(top,1):
              lines.append(f"| {i} | {r['score_floor']:.0f} | {r['entry_policy']} | {r['min_allocation_pct']:.0f}% | {r['idle_cash_sp500_pct']}% | {r['train']['total_return_pct']:+.2f}% | {r['train']['alpha_pct']:+.2f} pp | {r['train']['max_drawdown_pct']:.2f}% | {r['holdout']['total_return_pct']:+.2f}% | {benchmark['holdout']['total_return_pct']:+.2f}% | {r['holdout']['alpha_pct']:+.2f} pp | {r['holdout']['max_drawdown_pct']:.2f}% | {r['trade_count']} |")
          lines+=['',
                  '## Benchmark',
                  f"- 2024-2025 S&P 500 Total Return: {benchmark['train']['total_return_pct']:+.2f}%",
                  f"- 2026 holdout S&P 500 Total Return: {benchmark['holdout']['total_return_pct']:+.2f}%",
                  f"- Full-period S&P 500 Total Return: {benchmark['full']['total_return_pct']:+.2f}%",
                  '',
                  '## Guardrails',
                  '- R/R >=2x is fixed.',
                  '- Fundamental quality floor is fixed.',
                  '- Daily deep coverage is fixed at 160.',
                  '- Any training configuration with >15% drawdown is excluded before ranking.',
                  '- Profit-harvest overlay is off because the prior ablation reduced returns.',
                  '- Holdout performance is reported only after train ranking and does not influence selection.',
                  '- Qualified-any-zone is exploratory; it is not automatically a production recommendation even if it wins in-sample.']
          Path('backtests/results/wf3_walkforward_optimization.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit optimization report
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/wf3_walkforward_optimization.json backtests/results/wf3_walkforward_optimization.md
          git diff --cached --quiet && exit 0
          git commit -m "Add train-holdout WF3 optimization report [skip ci]"
          git pull --rebase origin main
          git push
