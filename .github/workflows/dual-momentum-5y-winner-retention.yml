name: dual-momentum-5y-winner-retention

on:
  push:
    branches: [dual-momentum-dashboard]
    paths:
      - "scripts/dual_momentum_winner_retention_5y.py"
      - ".github/workflows/dual-momentum-5y-winner-retention.yml"
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dual_momentum_requirements.txt requests
      - name: Run winner-retention tests
        run: python scripts/dual_momentum_winner_retention_5y.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-momentum-5y-winner-retention-result
          path: backtests/results/dual_momentum_winner_retention_5y.json
          if-no-files-found: ignore
