name: WF3 160 Attribution

on:
  push:
    paths:
      - .github/workflows/wf3-160-attribution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - name: Run corrected 160 coverage attribution
        run: python scripts/wf3_coverage_ablation.py --coverage 160 --output backtests/results/wf3_coverage_160_attribution.json
      - name: Commit attribution
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/wf3_coverage_160_attribution.json
          git diff --cached --quiet && exit 0
          git commit -m "Add corrected WF3 160-stock attribution [skip ci]"
          git pull --rebase origin main
          git push
