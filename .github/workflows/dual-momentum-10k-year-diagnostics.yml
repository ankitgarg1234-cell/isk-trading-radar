name: dual-momentum-10k-year-diagnostics

on:
  push:
    branches: [dual-momentum-dashboard]
    paths:
      - "scripts/dual_momentum_10k_year_diagnostics.py"
      - ".github/workflows/dual-momentum-10k-year-diagnostics.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dual_momentum_requirements.txt requests
      - name: Run yearly diagnostics
        run: python scripts/dual_momentum_10k_year_diagnostics.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-momentum-10k-year-diagnostics
          path: backtests/results/dual_momentum_10k_year_diagnostics.json
          if-no-files-found: ignore
