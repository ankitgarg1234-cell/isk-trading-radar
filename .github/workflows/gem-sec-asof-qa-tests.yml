name: GEM SEC As-of QA Tests
on:
  pull_request:
    branches:
      - audit/gemv1-sec-evidence-atomicity-20261012
    paths:
      - "gem_data/sec_asof_reconciliation.py"
      - "tests/test_gem_sec_asof_reconciliation.py"
      - ".github/workflows/gem-sec-asof-qa-tests.yml"
  workflow_dispatch:

jobs:
  sec-asof-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_gem_sec_collector.py tests/test_gem_sec_asof_reconciliation.py
