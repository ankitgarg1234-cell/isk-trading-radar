name: GEMv1 frozen-rule parity (isolated)
on:
  push:
    branches:
      - fix/gemv1-frozen-parity-manual-20261013
  pull_request:
    branches:
      - draft/gem-standalone-render-20261012
permissions:
  contents: read
jobs:
  frozen-rule-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed GEM-only Python modules
        run: |
          python -m compileall -q gem_data/gem_monthly_signal.py gem_data/gem_source_feature_verifier.py gem_data/gem_manual_ops.py gem_data/gem_monthly_packet.py gem_data/gem_sec_frozen_parity.py
      - name: Frozen GEMv1 manual workflow regression
        run: |
          python -m unittest discover -s tests -p 'test_gem_frozen_parity_manual.py' -v
      - name: List GEM-only test modules
        run: find tests -name '*gem*.py' -type f -print | sort
      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run existing and new GEM-only regression suite
        run: python -m pytest -q tests/test_gem_*.py
