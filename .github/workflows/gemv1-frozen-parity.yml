name: GEMv1 frozen-rule parity (isolated)
on:
  push:
    branches:
      - fix/gemv1-frozen-parity-manual-20261013
  pull_request:
    branches:
      - draft/gem-standalone-render-20261012
permissions:
  contents: read
jobs:
  frozen-rule-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed GEM-only Python modules
        run: |
          python -m compileall -q gem_data/gem_monthly_signal.py gem_data/gem_source_feature_verifier.py gem_data/gem_manual_ops.py gem_data/gem_monthly_packet.py gem_data/gem_sec_frozen_parity.py gem_data/gem_edgartools_exception.py scripts/gem_sec_edgartools_fallback_cli.py
      - name: Frozen GEMv1 manual workflow regression
        run: |
          python -m unittest discover -s tests -p 'test_gem_frozen_parity_manual.py' -v
      - name: List GEM-only test modules
        run: find tests -name '*gem*.py' -type f -print | sort
      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run existing and new GEM-only regression suite
        run: python -m pytest -q tests/test_gem_*.py
      - name: Smoke-test pinned EdgarTools API (NO SEC network calls)
        run: |
          python -m pip install -r requirements-gem-sec-xbrl.txt
          python - <<'PY'
          from edgar import get_by_accession_number, set_identity
          assert callable(get_by_accession_number)
          assert callable(set_identity)
          print("EdgarTools accession and SEC identity APIs import successfully")
          PY

  public-nyse-spy-quickwins:
    name: Public NYSE and SPY diagnostics (not source certification)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated public research dependencies
        run: python -m pip install 'exchange-calendars>=4.6,<5' 'yfinance>=0.2.65,<1'
      - name: Verify NYSE 2026 schedule against independent XNYS sessions
        run: python -m scripts.gem_source_fastpath_ci --outdir /tmp/gem-public-source-quickwins
      - name: Observe SPY raw closing prices and dividend events
        env:
          GEM_SOURCE_FASTPATH_ALLOW_YFINANCE: 'yes'
        run: |
          if python -m scripts.gem_source_fastpath_ci --outdir /tmp/gem-public-source-quickwins --fetch-spy; then
            echo 'SPY_OBSERVED_NOT_SOURCE_CERTIFIED'
          else
            echo 'SPY_VENDOR_UNAVAILABLE_OR_QA_HOLD'
            echo 'SPY_VENDOR_UNAVAILABLE_OR_QA_HOLD' > /tmp/gem-public-source-quickwins/spy-provider-hold.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gem-public-quickwins-uncertified
          path: /tmp/gem-public-source-quickwins/
          retention-days: 7

  one-shot-public-equity-503:
    name: One-shot 503-member Yahoo price/volume research triage, no trades
    if: false  # Disabled after bounded public diagnostic; reenable only on explicitly approved one-shot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public research price library (NOT production)
        run: python -m pip install 'yfinance>=0.2.65,<1'
      - name: Run pinned month-end provisional momentum and price coverage
        env:
          GEM_PUBLIC_UNIVERSE_ALLOW_YFINANCE: 'yes'
        run: |
          python -m scripts.gem_public_universe_price_probe_cli --run --limit 503 --batch-size 40 --outdir /tmp/gem-yahoo-research-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gem-503-research-only-price-exceptions
          path: /tmp/gem-yahoo-research-only/
          retention-days: 7
