name: SPY Sector Hierarchy Backtest

on:
  push:
    branches:
      - research/adaptive-market-state-backtest
    paths:
      - scripts/spy_sector_hierarchy_backtest.py
      - .github/workflows/spy-sector-hierarchy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spy-sector-hierarchy-results
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-2022-2026
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas lxml requests pyarrow
      - name: Validate
        run: python -m py_compile scripts/spy_sector_hierarchy_backtest.py
      - name: Run
        run: python scripts/spy_sector_hierarchy_backtest.py
      - name: Reconciliation (BLOCKED until original frozen ledger supplied)
        run: |
          python scripts/reconcile_frozen_baseline.py \
            --candidate backtests/results/spy_sector_hierarchy_2022_2026.json \
            --report backtests/results/frozen_baseline_reconciliation.json
      - name: Commit results
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/spy_sector_hierarchy_2022_2026.json backtests/results/spy_sector_hierarchy_2022_2026.md backtests/results/frozen_baseline_reconciliation.json
          git diff --cached --quiet && exit 0
          git commit -m "Update SPY-sector hierarchy research [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
