name: SEC bulk preflight

on:
  push:
    paths:
      - .github/workflows/sec-bulk-preflight.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test SEC bulk archive reachability
        run: |
          python - <<'PY'
          import requests
          u='https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip'
          h={'User-Agent':'ISK Trading Radar research https://github.com/ankitgarg1234-cell/isk-trading-radar','Range':'bytes=0-1023'}
          r=requests.get(u,headers=h,timeout=(5,20),stream=True)
          print('status',r.status_code)
          print('content-length',r.headers.get('content-length'))
          print('content-range',r.headers.get('content-range'))
          chunk=next(r.iter_content(1024),b'')
          print('bytes',len(chunk),'magic',chunk[:4])
          if r.status_code not in (200,206) or chunk[:2] != b'PK':
              raise SystemExit(1)
          PY
