name: SEC bulk preflight

on:
  push:
    paths:
      - .github/workflows/sec-bulk-preflight.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test SEC bulk archive reachability
        run: |
          code=$(curl -L --max-time 25 --connect-timeout 5 -A "ISK Trading Radar research https://github.com/ankitgarg1234-cell/isk-trading-radar" -H "Range: bytes=0-1023" -o /tmp/sec_head.bin -sS -w "%{http_code}" "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip")
          echo "status=$code"
          ls -l /tmp/sec_head.bin || true
          xxd -l 4 /tmp/sec_head.bin || true
          test "$code" = "200" -o "$code" = "206"
          python - <<'PY'
          from pathlib import Path
          b=Path("/tmp/sec_head.bin").read_bytes()[:4]
          print("magic",b)
          if not b.startswith(b"PK"):
              raise SystemExit(1)
          PY
