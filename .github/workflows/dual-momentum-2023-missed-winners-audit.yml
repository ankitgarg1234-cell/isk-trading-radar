name: dual-momentum-2023-missed-winners-audit

on:
  push:
    branches: [dual-momentum-dashboard]
    paths:
      - "scripts/dual_momentum_2023_missed_winners_audit.py"
      - ".github/workflows/dual-momentum-2023-missed-winners-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dual_momentum_requirements.txt requests
      - name: Run 2023 missed-winners attribution audit
        run: python scripts/dual_momentum_2023_missed_winners_audit.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-momentum-2023-missed-winners-audit
          path: backtests/results/dual_momentum_2023_missed_winners_audit.json
          if-no-files-found: ignore
