name: GEM Neon Pooler Read-Only Connection Tests
on:
  pull_request:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "dual_momentum/gem_dashboard.py"
      - "tests/test_gem_dashboard.py"
      - "tests/test_gem_standalone.py"
      - ".github/workflows/gem-neon-pooler-readonly-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-readonly-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GEM dashboard test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate pooler setup and no execution
        run: python -m pytest -q tests/test_gem_dashboard.py tests/test_gem_standalone.py
