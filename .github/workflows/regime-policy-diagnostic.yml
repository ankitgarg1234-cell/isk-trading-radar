name: Regime Policy Diagnostic

on:
  push:
    branches:
      - research/adaptive-market-state-backtest
    paths:
      - scripts/regime_policy_diagnostic.py
      - .github/workflows/regime-policy-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: python scripts/regime_policy_diagnostic.py
      - name: Commit
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/regime_policy_matrix_diagnostic.md
          git diff --cached --quiet && exit 0
          git commit -m "Update regime-policy diagnostic [skip ci]"
          git push
