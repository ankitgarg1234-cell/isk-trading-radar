name: GEM V1 offline forward safety

on:
  push:
    branches: [research/gem-forward-safety-2026-10-11]
    paths:
      - 'gem_paper/**'
      - 'tests/gem_paper/**'
      - 'docs/gem-v1/**'
      - '.github/workflows/gem-forward-safety.yml'
  pull_request:
    branches: [research/gem-2025-2026-validation-2026-10-11]
    paths:
      - 'gem_paper/**'
      - 'tests/gem_paper/**'
      - 'docs/gem-v1/**'
      - '.github/workflows/gem-forward-safety.yml'

permissions:
  contents: read

concurrency:
  group: gem-forward-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline controls and pinned observed-feature regressions
        run: python -m unittest discover -s tests/gem_paper -v
      - name: Confirm execution remains closed
        run: |
          python - <<'PY'
          from gem_paper.qa import authorize_purchase
          assert authorize_purchase(release_signoff={'approved': True})['authorized'] is False
          print('GEM_EXECUTION_DISABLED')
          PY
