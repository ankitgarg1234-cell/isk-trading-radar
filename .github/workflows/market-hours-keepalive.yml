name: U.S. market-hours keepalive

on:
  schedule:
    # Runs on the default branch. Five-minute wakeups cover both New York
    # DST and standard time, including delayed data after the close.
    # GitHub Actions scheduled starts are best-effort, not exact.
    - cron: "2-57/5 13-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-hours-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake original radar and paper-trial service
        shell: bash
        run: |
          set -euo pipefail
          health() {
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --connect-timeout 20 --max-time 180 "${1}"
          }
          # Two health checks in parallel, one GitHub runner.
          # These are public wakeups; the logged-in app controls trial actions.
          health https://isk-trading-radar.onrender.com/health &
          original_pid=$!
          health https://dual-momentum-radar.onrender.com/health &
          paper_pid=$!
          wait "$original_pid"
          wait "$paper_pid"
