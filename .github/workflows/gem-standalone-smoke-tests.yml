name: GEM Standalone Render Smoke Tests
on:
  push:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "gem_data/gem_marketstack_backfill.py"
      - "gem_data/gem_research_robot.py"
      - "gem_data/gem_standalone.py"
      - "gem_data/gem_price_receipt_audit.py"
      - "tests/test_gem_price_receipt_audit.py"
      - "gem_data/gem_portfolio_routes.py"
      - "tests/test_gem_marketstack_speed.py"
      - "tests/test_gem_research_robot.py"
      - ".github/workflows/gem-standalone-smoke-tests.yml"
  pull_request:
    branches: [draft/gem-marketstack-eod-probe-20261012, dual-momentum-dashboard]
    paths:
      - "gem_data/gem_standalone.py"
      - "tests/test_gem_standalone.py"
      - ".github/workflows/gem-standalone-smoke-tests.yml"
  workflow_dispatch:

jobs:
  isolated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate isolated entrypoint and GEM routes without secrets
        run: |
          python -m compileall -q gem_data
          python -m pytest -q tests/test_gem_marketstack_initial_backfill.py tests/test_gem_marketstack_speed.py tests/test_gem_research_robot.py tests/test_gem_price_receipt_audit.py tests/test_gem_marketstack_probe.py tests/test_gem_standalone.py tests/test_gem_dashboard.py tests/test_gem_sec_inline_remediation.py tests/test_gem_sec_exception_queue.py tests/test_gem_sec_annual_source.py tests/test_gem_sec_reconciliation.py tests/test_gem_sec_gate_triage.py tests/test_gem_sec_reconciliation_routes.py tests/test_gem_sec_historical_submissions.py
