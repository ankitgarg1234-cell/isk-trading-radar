name: GEM Standalone Render Smoke Tests
on:
  pull_request:
    branches: [draft/gem-marketstack-eod-probe-20261012, dual-momentum-dashboard]
    paths:
      - "gem_data/gem_standalone.py"
      - "tests/test_gem_standalone.py"
      - ".github/workflows/gem-standalone-smoke-tests.yml"
  workflow_dispatch:

jobs:
  isolated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate isolated entrypoint and GEM routes without secrets
        run: |
          python -m compileall -q gem_data
          python -m pytest -q tests/test_gem_standalone.py tests/test_gem_dashboard.py tests/test_gem_sec_inline_remediation.py tests/test_gem_sec_exception_queue.py tests/test_gem_sec_annual_source.py
