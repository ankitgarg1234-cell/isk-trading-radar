name: Tier-1 V3 isolated Render smoke tests
on:
  push:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "tier1_v3/**"
      - "tests/test_tier1_v3_dashboard.py"
      - "gem_data/gem_standalone.py"
      - ".github/workflows/gem-standalone-smoke-tests.yml"
  workflow_dispatch:

jobs:
  isolated-tier1-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile V3 and compatibility entry point
        run: python -m compileall -q tier1_v3 gem_data/gem_standalone.py
      - name: Test V3 isolation, PIT gates and drawdown arithmetic
        run: python -m pytest -q tests/test_tier1_v3_dashboard.py
