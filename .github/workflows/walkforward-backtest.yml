name: 2022-2026 Walk-Forward Backtest

on:
  push:
    branches:
      - research/no-bear-liquidation-backtest
    paths:
      - scripts/walkforward_backtest.py
      - backtest/no_bear_parts/**
      - .github/workflows/walkforward-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walkforward-2022-2026
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-2022-2026
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas lxml requests
      - name: Run
        run: |
          python scripts/walkforward_backtest.py --start 2022-01-01 --end 2026-10-01
      - name: Commit results
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/walkforward_2022_2026.json backtests/results/walkforward_2022_2026.md
          git diff --cached --quiet && exit 0
          git commit -m "Update 2022-2026 no-BEAR research backtest [skip ci]"
          git push
