name: GEM SEC ZIP Delta and Integrity Tests
on:
  pull_request:
    branches: [draft/gem-standalone-render-20261012]
    paths:
      - "gem_data/sec_bulk_zip_ingest.py"
      - "gem_data/sec_zip_index.py"
      - "gem_data/sec_independent_fact_verify.py"
      - "gem_data/sec_fact_audit_worker.py"
      - "gem_data/gem_standalone.py"
      - "tests/test_gem_sec_bulk_zip_ingest.py"
      - "tests/test_gem_sec_independent_fact_verify.py"
      - ".github/workflows/gem-sec-delta-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: SEC range/delta safety and independent fact verifier tests
        run: python -m pytest -q tests/test_gem_sec_bulk_zip_ingest.py tests/test_gem_sec_independent_fact_verify.py tests/test_gem_standalone.py tests/test_gem_sec_collector.py
