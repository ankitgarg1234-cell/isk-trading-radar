name: dual-momentum-5y-backtest

on:
  push:
    branches: [dual-momentum-dashboard]
    paths:
      - "scripts/dual_momentum_backtest_5y.py"
      - ".github/workflows/dual-momentum-5y-backtest.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dual_momentum_requirements.txt
      - name: Run five-year dual momentum backtest
        run: python scripts/dual_momentum_backtest_5y.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-momentum-5y-result
          path: backtests/results/dual_momentum_5y_2021_2026.json
          if-no-files-found: ignore
