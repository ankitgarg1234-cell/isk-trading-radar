name: Sector First Trade Churn Audit

on:
  push:
    branches:
      - research/adaptive-market-state-backtest
    paths:
      - scripts/sector_first_trade_churn_audit.py
      - .github/workflows/sector-first-churn-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze trades
        run: python scripts/sector_first_trade_churn_audit.py
      - name: Commit audit
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/sector_first_explicit_churn_audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Update sector-first churn audit [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
