name: GEM source quickwins (public data diagnostics only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-and-spy-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install separate public research dependencies
        run: python -m pip install 'exchange-calendars>=4.6,<5' 'yfinance>=0.2.65,<1'
      - name: Reconcile published NYSE core-equities sessions to XNYS
        run: |
          python -m scripts.gem_source_fastpath_ci --outdir /tmp/gem-public-source-quickwins
      - name: Attempt single ticker SPY price and dividend observation
        env:
          GEM_SOURCE_FASTPATH_ALLOW_YFINANCE: 'yes'
        run: |
          if python -m scripts.gem_source_fastpath_ci --outdir /tmp/gem-public-source-quickwins --fetch-spy; then
            echo 'SPY_RAW_OBSERVATION_SUCCESS_NOT_SOURCE_CERTIFIED'
          else
            echo 'SPY_PUBLIC_YFINANCE_HOLD: No source approval or trading permission granted'
            echo 'SPY_PUBLIC_YFINANCE_HOLD' > /tmp/gem-public-source-quickwins/spy-vendor-hold.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gem-public-nyse-spy-uncertified
          path: /tmp/gem-public-source-quickwins/
          retention-days: 7
