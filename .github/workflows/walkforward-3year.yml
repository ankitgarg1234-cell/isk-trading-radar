name: 2024-2026 Three-Year Walk-Forward

on:
  push:
    paths:
      - .github/workflows/walkforward-3year.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walkforward-3year
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-3year-2024-2026
          restore-keys: |
            walkforward-v1-2022-2026

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas lxml requests

      - name: Preflight
        run: |
          python -m py_compile scripts/walkforward_backtest.py
          python - <<'PY'
          import requests
          urls=[
            "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies",
            "https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=5d&interval=1d",
            "https://raw.githubusercontent.com/Ancalagan/sec-data/main/company_tickers.json",
          ]
          for u in urls:
            r=requests.get(u,timeout=30,headers={"User-Agent":"Mozilla/5.0 ISK backtest"})
            print(r.status_code,u)
            r.raise_for_status()
          PY

      - name: Run three-year point-in-time replay
        env:
          PYTHONPATH: .
          SEC_USER_AGENT: "ISK Trading Radar research contact https://github.com/ankitgarg1234-cell/isk-trading-radar"
        run: |
          python scripts/walkforward_backtest.py             --start 2024-01-01             --end 2026-10-01             --output backtests/results/walkforward_2024_2026.json             --markdown backtests/results/walkforward_2024_2026.md

      - name: Commit results
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/walkforward_2024_2026.json backtests/results/walkforward_2024_2026.md
          git diff --cached --quiet && exit 0
          git commit -m "Update 2024-2026 walk-forward backtest [skip ci]"
          git push
