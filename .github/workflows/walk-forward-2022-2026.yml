name: 2022-2026 Walk Forward

on:
  push:
    paths:
      - 'backtest/.parts/**'
      - '.github/workflows/walk-forward-2022-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walk-forward-2022-2026
  cancel-in-progress: true

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas yfinance lxml html5lib

      - name: Reconstruct and validate backtest
        run: |
          mkdir -p backtest_results
          cat backtest/.parts/wf_fix00a.b64 backtest/.parts/wf_fix00b.b64 backtest/.parts/wf_01.b64 backtest/.parts/wf_02.b64 backtest/.parts/wf_03.b64 backtest/.parts/wf_04.b64 backtest/.parts/wf_05.b64 backtest/.parts/wf_06.b64 backtest/.parts/wf_07.b64 | tr -d '\n\r' | base64 -d > /tmp/walk_forward_2022_2026.py
          python -m py_compile /tmp/walk_forward_2022_2026.py
          wc -c /tmp/walk_forward_2022_2026.py
          sha256sum /tmp/walk_forward_2022_2026.py

      - name: Run point-in-time walk-forward
        env:
          PYTHONPATH: .
        run: python /tmp/walk_forward_2022_2026.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-2022-2026
          path: backtest_results/
          if-no-files-found: warn
          retention-days: 14
