name: WF3 Score Sizing Grid

on:
  push:
    paths:
      - scripts/wf3_score_sizing_grid.py
      - scripts/walkforward_backtest.py
      - scripts/wf3_offline_valuein.py
      - .github/workflows/wf3-score-sizing-grid.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf3-score-sizing-grid
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - name: Run score-sizing grid
        run: python scripts/wf3_score_sizing_grid.py
      - name: Determinism rerun
        run: |
          cp backtests/results/wf3_score_sizing_grid.json /tmp/a.json
          python scripts/wf3_score_sizing_grid.py
          python - <<'PY'
          import json
          a=json.load(open('/tmp/a.json')); b=json.load(open('backtests/results/wf3_score_sizing_grid.json'))
          print('HASH_A',a['deterministic_hash'])
          print('HASH_B',b['deterministic_hash'])
          if a['deterministic_hash'] != b['deterministic_hash']:
              raise SystemExit('determinism check failed')
          print('DETERMINISM_PASS')
          PY
      - name: Commit grid result
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/wf3_score_sizing_grid.json backtests/results/wf3_score_sizing_grid.md
          git diff --cached --quiet && exit 0
          git commit -m "Add WF3 score-sizing grid result [skip ci]"
          git pull --rebase origin main
          git push
