name: 2024-2026 Monthly Sensitivity Backtest

on:
  push:
    paths:
      - scripts/walkforward_backtest_monthly.py
      - .github/workflows/walkforward-3year-monthly.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walkforward-3year-monthly
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-3year-monthly
          restore-keys: |
            walkforward-v1-3year-fast
            walkforward-v1-3year-2024-2026
            walkforward-v1-2022-2026
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas lxml requests
      - name: Run monthly sensitivity
        id: replay
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          mkdir -p backtests/results
          set -o pipefail
          python scripts/walkforward_backtest_monthly.py 2>&1 | tee backtests/results/walkforward_2024_2026_monthly_run.log
      - name: Commit result or traceback
        if: always()
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/walkforward_2024_2026_monthly_run.log || true
          test -f backtests/results/walkforward_2024_2026_monthly.json && git add backtests/results/walkforward_2024_2026_monthly.json || true
          test -f backtests/results/walkforward_2024_2026_monthly.md && git add backtests/results/walkforward_2024_2026_monthly.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Capture 2024-2026 monthly backtest [skip ci]"
          git pull --rebase origin main
          git push
      - name: Fail if replay failed
        if: steps.replay.outcome == 'failure'
        run: exit 1
