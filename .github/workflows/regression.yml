name: regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./ci-radar.db
      APP_PASSWORD: ""
      DISABLE_SCANNER: "true"
      STRATEGIC_CAPITAL_ENABLED: "true"
      STRATEGIC_DISCLOSURE_PDF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check dashboard JavaScript syntax
        run: node --check app/static/app.js
      - name: Run regression suite
        run: pytest -q app/tests tests


  python314-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./ci-radar-py314.db
      APP_PASSWORD: ""
      DISABLE_SCANNER: "true"
      STRATEGIC_CAPITAL_ENABLED: "false"
      STRATEGIC_DISCLOSURE_PDF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify production Python startup imports
        run: python -c "import app.db; import app.main; print('PYTHON314_STARTUP_PASS')"


  live-owned-opportunity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live candidate ownership state
        run: |
          curl --fail --silent --show-error --max-time 30 https://isk-trading-radar.onrender.com/api/live > /tmp/live.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/live.json'))
          candidates=d.get('candidates') or []
          paper=(d.get('paper') or {})
          held={p.get('symbol') for p in paper.get('positions') or []}
          shown={c.get('symbol') for c in candidates}
          print('HELD',sorted(held))
          print('CANDIDATES',[(c.get('symbol'),c.get('optimizer_action'),c.get('owned')) for c in candidates])
          print('OVERLAP',sorted(held & shown))
          print('VISIBLE',len(candidates))
          print('BUY_NOW', (d.get('summary') or {}).get('buy_now'))
          print('ALLOCATION_POLICY',(d.get('optimizer') or {}).get('allocation_policy'))
          PY
