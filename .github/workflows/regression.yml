name: Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./ci_radar.db
      DISABLE_SCANNER: "true"
      APP_PASSWORD: ""
      OPENAI_API_KEY: ""
      STRATEGIC_DISCLOSURE_PDF_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Regression suite
        run: pytest -q tests
