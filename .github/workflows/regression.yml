name: regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./ci-radar.db
      APP_PASSWORD: ""
      DISABLE_SCANNER: "true"
      STRATEGIC_CAPITAL_ENABLED: "true"
      STRATEGIC_DISCLOSURE_PDF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check dashboard JavaScript syntax
        run: node --check app/static/app.js
      - name: Run regression suite
        run: pytest -q app/tests tests


  python314-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./ci-radar-py314.db
      APP_PASSWORD: ""
      DISABLE_SCANNER: "true"
      STRATEGIC_CAPITAL_ENABLED: "false"
      STRATEGIC_DISCLOSURE_PDF_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify production Python startup imports
        run: python -c "import app.db; import app.main; print('PYTHON314_STARTUP_PASS')"


  restored-ledger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify restored canonical ledger
        run: |
          echo "RESTORED_LEDGER_PROBE"
          python - <<'PY'
          import json, urllib.request
          d=json.load(urllib.request.urlopen("https://isk-trading-radar.onrender.com/api/live", timeout=30))
          paper=d.get("paper") or {}
          print("POSITIONS", sorted((p.get("symbol"),p.get("shares")) for p in paper.get("positions",[])))
          print("CASH", paper.get("cash"))
          print("COUNT", paper.get("position_count"))
          print("TRADES", paper.get("trade_count"))
          PY
