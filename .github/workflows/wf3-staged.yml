name: 2024-2026 Staged Walk-Forward

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf3-staged
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .wf3_cache_v1
          key: wf3-source-cache-v1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas lxml requests
      - name: Build point-in-time raw dataset
        run: |
          mkdir -p backtests/staged
          set -o pipefail
          python scripts/wf3_data.py 2>&1 | tee backtests/staged/data_build.log
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: wf3-raw-data
          path: |
            backtests/staged/raw_dataset.json.gz
            backtests/staged/data_build.log
          retention-days: 7

  smoke:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - uses: actions/download-artifact@v4
        with:
          name: wf3-raw-data
          path: backtests/staged
      - name: Three-month smoke snapshot
        run: |
          python scripts/wf3_snapshots.py --dataset backtests/staged/raw_dataset.json.gz --year 2024 --start 2024-01-01 --end 2024-03-31 --shortlist-limit 20 --output backtests/staged/smoke_2024.json.gz
      - name: Smoke simulation and invariants
        run: |
          python scripts/wf3_simulate.py --dataset backtests/staged/raw_dataset.json.gz --snapshots backtests/staged/smoke_2024.json.gz --output backtests/staged/smoke_result.json --markdown backtests/staged/smoke_result.md --smoke

  snapshots:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - uses: actions/download-artifact@v4
        with:
          name: wf3-raw-data
          path: backtests/staged
      - name: Build point-in-time snapshots
        run: python scripts/wf3_snapshots.py --dataset backtests/staged/raw_dataset.json.gz --year ${{ matrix.year }} --output backtests/staged/snapshots_${{ matrix.year }}.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wf3-snapshots-${{ matrix.year }}
          path: backtests/staged/snapshots_${{ matrix.year }}.json.gz
          retention-days: 7

  simulate:
    needs: snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - uses: actions/download-artifact@v4
        with:
          name: wf3-raw-data
          path: backtests/staged
      - uses: actions/download-artifact@v4
        with:
          pattern: "wf3-snapshots-*"
          path: backtests/staged/snapshots
          merge-multiple: true
      - name: Run deterministic three-variant replay
        run: |
          mkdir -p backtests/results
          python scripts/wf3_simulate.py --dataset backtests/staged/raw_dataset.json.gz --snapshots backtests/staged/snapshots/snapshots_2024.json.gz backtests/staged/snapshots/snapshots_2025.json.gz backtests/staged/snapshots/snapshots_2026.json.gz --output backtests/results/walkforward_2024_2026_staged.json --markdown backtests/results/walkforward_2024_2026_staged.md
      - uses: actions/upload-artifact@v4
        with:
          name: wf3-final-result
          path: |
            backtests/results/walkforward_2024_2026_staged.json
            backtests/results/walkforward_2024_2026_staged.md
          retention-days: 14
      - name: Commit final result
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/walkforward_2024_2026_staged.json backtests/results/walkforward_2024_2026_staged.md
          git diff --cached --quiet && exit 0
          git commit -m "Add staged 2024-2026 walk-forward result [skip ci]"
          git pull --rebase origin main
          git push
