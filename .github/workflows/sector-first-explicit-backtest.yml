name: Sector First Explicit Five Year Backtest

on:
  push:
    branches:
      - research/adaptive-market-state-backtest
    paths:
      - scripts/sector_first_explicit_backtest.py
      - scripts/test_sector_first_explicit.py
      - .github/workflows/sector-first-explicit-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-first-explicit-results
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: walkforward-v1-2022-2026
      - name: Install
        run: pip install pandas numpy requests lxml pyarrow
      - name: Compile
        run: python -m py_compile scripts/sector_first_explicit_backtest.py scripts/test_sector_first_explicit.py
      - name: Deterministic tests
        run: python scripts/test_sector_first_explicit.py
      - name: Full five-year replay
        run: python scripts/sector_first_explicit_backtest.py
      - name: Trade-path and cost audit
        run: python scripts/sector_first_trade_churn_audit.py
      - name: Publish result to research branch
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/sector_first_explicit_2022_2026.json backtests/results/sector_first_explicit_2022_2026.md backtests/results/sector_first_explicit_churn_audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Results sector-first explicit five-year replay [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
