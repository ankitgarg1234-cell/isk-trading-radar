name: GEM Marketstack EOD Probe Tests
on:
  pull_request:
    branches: [dual-momentum-dashboard]
    paths:
      - "gem_data/marketstack_eod_probe.py"
      - "tests/test_gem_marketstack_probe.py"
      - ".github/workflows/gem-marketstack-probe-tests.yml"
  workflow_dispatch:

jobs:
  offline-marketstack-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install pytest httpx
      - name: Check no-secret Marketstack probe tests
        run: python -m pytest -q tests/test_gem_marketstack_probe.py
