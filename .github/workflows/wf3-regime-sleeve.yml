name: WF3 Regime Sleeve

on:
  push:
    paths:
      - scripts/wf3_regime_sleeve.py
      - .github/workflows/wf3-regime-sleeve.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf3-regime-sleeve
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regime sleeve
        run: python scripts/wf3_regime_sleeve.py
      - name: Commit result
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/wf3_regime_sleeve.json backtests/results/wf3_regime_sleeve.md
          git diff --cached --quiet && exit 0
          git commit -m "Add regime-managed idle-cash sleeve result [skip ci]"
          git pull --rebase origin main
          git push
