name: WF3 Daily PIT Backtest

on:
  push:
    paths:
      - scripts/wf3_offline_valuein_daily.py
      - scripts/wf3_offline_valuein.py
      - .github/workflows/wf3-daily-valuein.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf3-daily-pit
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas lxml requests
      - name: 60-session smoke test
        run: python scripts/wf3_offline_valuein_daily.py --smoke-days 60
      - name: Full daily replay
        run: python scripts/wf3_offline_valuein_daily.py
      - name: Determinism rerun
        run: |
          python scripts/wf3_offline_valuein_daily.py --output /tmp/wf3_daily_check.json --markdown /tmp/wf3_daily_check.md
          python - <<'PY'
          import json
          a=json.load(open('backtests/results/walkforward_2024_2026_valuein_daily.json'))
          b=json.load(open('/tmp/wf3_daily_check.json'))
          print('HASH_A',a['deterministic_hash'])
          print('HASH_B',b['deterministic_hash'])
          if a['deterministic_hash'] != b['deterministic_hash']:
              raise SystemExit('determinism check failed')
          print('DETERMINISM_PASS')
          PY
      - name: Commit daily result
        run: |
          git config user.name "isk-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/results/walkforward_2024_2026_valuein_daily.json backtests/results/walkforward_2024_2026_valuein_daily.md
          git diff --cached --quiet && exit 0
          git commit -m "Add daily 2024-2026 PIT walk-forward result [skip ci]"
          git pull --rebase origin main
          git push
