<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • ISK Radar</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login-wrap"><section class="panel login-card"><div class="eyebrow">PRIVATE DASHBOARD</div><h1>ISK Trading Radar</h1>{% if error %}<div class="error-box">{{ error }}</div>{% endif %}{% if enabled %}<form method="post" action="/login" class="stack-form"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary">Login</button></form>{% else %}<p>Password protection is not configured yet. Set <code>APP_PASSWORD</code> in Render.</p><a class="btn primary" href="/">Continue</a>{% endif %}</section></main></body></html>
