<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual Momentum Radar</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#091018;color:#edf3f7}
.card{width:min(420px,calc(100vw - 32px));background:#111a24;border:1px solid #263442;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0008}
.kicker{font-size:12px;letter-spacing:.14em;color:#7f93a6;font-weight:800}h1{margin:8px 0 8px}p{color:#9eb0bf;line-height:1.5}
label{display:block;margin:15px 0 6px;color:#b9c6d1;font-size:13px}input{width:100%;box-sizing:border-box;background:#0b131c;border:1px solid #324252;color:white;padding:12px;border-radius:10px}
button{margin-top:18px;width:100%;border:0;background:#d7ff58;color:#10140a;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}
.error{background:#3b1720;color:#ffb8c2;padding:10px 12px;border-radius:10px;margin-top:14px}
</style>
</head>
<body><main class="card"><span class="kicker">S&amp;P 500 • ROTATIONAL SYSTEM</span><h1>Dual Momentum Radar</h1>
<p>Deterministic monthly ranking, point-in-time fundamentals, inverse-ATR sizing and ratcheted stops.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if enabled %}
<form method="post" action="/login"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form>
{% else %}<form method="post" action="/login"><input type="hidden" name="username" value=""><input type="hidden" name="password" value=""><button>Continue</button></form>{% endif %}
</main></body></html>
